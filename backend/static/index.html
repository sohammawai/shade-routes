<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="shade-api" content="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shade Routes Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script>try{var t=localStorage.getItem('sr-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* ================= tokens ================= */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --r-panel:10px; --r-card:6px; --r-ctl:5px; --r-tag:3px;
  --label:#1d1d1f; --label2:rgba(60,60,67,.64); --label3:rgba(60,60,67,.3);
  --fill:rgba(118,118,128,.12); --fill-strong:rgba(118,118,128,.22);
  --sep:rgba(60,60,67,.14); --hairline:rgba(0,0,0,.08);
  --material:rgba(252,252,253,.9); --material-border:rgba(0,0,0,.08);
  --group:#FFFFFF; --seg-on:#FFFFFF; --callout:#FFFFFF; --menu:rgba(252,252,253,.98); --hover:rgba(118,118,128,.08);
  --blue:#007AFF; --loc:#1A73E8; --green:#1E9E47; --green-ink:#17763A; --orange:#E8710A; --orange-ink:#A85400; --red:#E5372B;
  --green-tint:rgba(30,158,71,.1); --orange-tint:rgba(232,113,10,.11); --blue-tint:rgba(0,122,255,.1);
  --shadow:0 10px 30px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
  --shadow-sm:0 1px 4px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.06);
  --land:#F4F3F0;
  --bubble-in:#ECECEE; --bubble-in-ink:#1d1d1f;
  --tabbar-h:58px; --sheet-h:150px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --label:#F2F2F4; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.28);
    --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.38); --sep:rgba(84,84,88,.5); --hairline:rgba(255,255,255,.08);
    --material:rgba(30,31,34,.92); --material-border:rgba(255,255,255,.1);
    --group:rgba(46,47,51,.95); --seg-on:#5A5A5E; --callout:#2C2D30; --menu:rgba(40,40,42,.98); --hover:rgba(255,255,255,.05);
    --blue:#0A84FF; --loc:#8AB4F8; --green:#34C759; --green-ink:#5BD67C; --orange:#FF9F0A; --orange-ink:#FFB340; --red:#FF5147;
    --green-tint:rgba(52,199,89,.14); --orange-tint:rgba(255,159,10,.14); --blue-tint:rgba(10,132,255,.18);
    --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    --shadow-sm:0 1px 4px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.07);
    --land:#1D1F23; --bubble-in:#3A3A3C; --bubble-in-ink:#F5F5F7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --label:#F2F2F4; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.28);
  --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.38); --sep:rgba(84,84,88,.5); --hairline:rgba(255,255,255,.08);
  --material:rgba(30,31,34,.92); --material-border:rgba(255,255,255,.1);
  --group:rgba(46,47,51,.95); --seg-on:#5A5A5E; --callout:#2C2D30; --menu:rgba(40,40,42,.98); --hover:rgba(255,255,255,.05);
  --blue:#0A84FF; --loc:#8AB4F8; --green:#34C759; --green-ink:#5BD67C; --orange:#FF9F0A; --orange-ink:#FFB340; --red:#FF5147;
  --green-tint:rgba(52,199,89,.14); --orange-tint:rgba(255,159,10,.14); --blue-tint:rgba(10,132,255,.18);
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 1px 4px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.07);
  --land:#1D1F23; --bubble-in:#3A3A3C; --bubble-in-ink:#F5F5F7;
  color-scheme:dark;
}

/* ================= base ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--land);color:var(--label);-webkit-font-smoothing:antialiased;overflow:hidden;
  font-size:14px;letter-spacing:-.006em;line-height:1.3;font-feature-settings:"cv11","ss01"}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.material{background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border:.5px solid var(--material-border);box-shadow:var(--shadow)}
body,.material,.group,.chip,.menu,.msg{transition:background-color .3s,color .3s,border-color .3s}

/* ================= map ================= */
#map{position:fixed;inset:0;background:var(--land)}
.maplibregl-canvas{outline:none}
.maplibregl-ctrl-attrib{font-size:10.5px}
.maplibregl-ctrl-attrib.maplibregl-compact{background:var(--material)!important;color:var(--label2)}
.maplibregl-ctrl-attrib a{color:inherit!important}
.dark-ui .maplibregl-ctrl-attrib-button{filter:invert(1)}
.map-fail{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--label2);z-index:1}
.map-fail b{display:block;color:var(--label);font-size:16px;margin-bottom:6px}

/* your location */
.me{width:22px;height:22px;pointer-events:none}
.me .halo{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--loc);opacity:.22;animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:scale(.45);opacity:.35}100%{transform:scale(1.35);opacity:0}}
.me .cone{position:absolute;left:50%;bottom:50%;width:60px;height:60px;margin-left:-30px;opacity:0;transition:opacity .3s;
  background:linear-gradient(to top,color-mix(in srgb,var(--loc) 55%,transparent),transparent);clip-path:polygon(50% 100%,12% 0,88% 0)}
.me.has-heading .cone{opacity:1}
.me .dot{position:absolute;inset:2px;border-radius:50%;background:var(--loc);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}

/* pins + route bubbles */
.pin{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));padding-bottom:6px}
.pin .head{width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--red);border:2px solid #fff;display:grid;place-items:center}
.pin .head::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.pin.start{padding:0}
.pin.start .head{width:18px;height:18px;border-radius:50%;transform:none;background:#fff;border:0;box-shadow:0 0 0 .5px rgba(0,0,0,.3)}
.pin.start .head::after{width:7px;height:7px;background:#1d1d1f}
.callout{padding:5px 9px 6px;border-radius:var(--r-ctl);background:var(--callout);color:var(--label);box-shadow:var(--shadow-sm);
  cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s;margin-bottom:8px}
.callout::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;margin-left:-4px;background:inherit;transform:rotate(45deg);border-radius:1px}
.callout b{display:block;font-size:13px;font-weight:700;line-height:1.15}
.callout span{font-size:10.5px;font-weight:500;color:var(--label2)}
.callout.on.k-coolest{background:var(--green);color:#fff} .callout.on.k-fastest{background:var(--orange);color:#fff} .callout.on.k-alt{background:var(--blue);color:#fff}
.callout.on span{color:rgba(255,255,255,.88)}

/* ================= search ================= */
.search{position:fixed;top:12px;left:12px;width:380px;border-radius:8px;z-index:8}
.search-row{display:flex;align-items:center;gap:6px;height:46px;padding:0 6px 0 10px}
.app-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(180deg,#5BCF67,#22994A);display:grid;place-items:center;color:#fff;font-size:15px;flex:none;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.15)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:15px;padding:0 4px}
.search input::placeholder{color:var(--label2)}
.search input::-webkit-search-cancel-button{display:none}
.search.picking{box-shadow:0 0 0 2px var(--blue),var(--shadow)}
.vline{width:.5px;height:22px;background:var(--sep)}
.icon-btn{width:32px;height:32px;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--label2);font-size:17px;flex:none;transition:background-color .15s,color .15s}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:var(--fill);color:var(--label)}
.results{border-top:.5px solid var(--sep);padding:4px;max-height:min(420px,60vh);overflow-y:auto}
.res{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:var(--r-ctl);text-align:left}
.res:hover,.res.act{background:var(--hover)}
.res .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .s{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.res .d{font-size:11.5px;color:var(--label2)}
.res-note{padding:8px 10px;font-size:12px;color:var(--label2)}
.pico{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:14px;flex:none}

/* appearance menu */
.menu{position:absolute;top:44px;right:4px;width:196px;padding:5px;border-radius:8px;background:var(--menu);border:.5px solid var(--material-border);
  box-shadow:0 12px 32px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.1);z-index:30;transform-origin:top right;animation:menuIn .14s ease-out}
@keyframes menuIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.menu-h{font-size:11px;font-weight:600;color:var(--label2);padding:5px 9px 4px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;height:28px;padding:0 9px;border-radius:4px;font-size:13px;text-align:left}
.menu button svg:first-child{font-size:15px;color:var(--label2)}
.menu .ck{margin-left:auto;font-size:14px;color:var(--blue);opacity:0}
.menu button[aria-checked="true"] .ck{opacity:1}
.menu button:hover,.menu button:focus-visible{background:var(--blue);color:#fff;outline:none}
.menu button:hover svg,.menu button:focus-visible svg{color:#fff!important}
.menu hr{border:0;border-top:.5px solid var(--sep);margin:5px 4px}
.menu .kbd{margin-left:auto;font-size:11px;color:var(--label3)}

/* ================= chips ================= */
.chips{position:fixed;top:12px;left:404px;right:60px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:6;padding:1px 2px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:var(--r-card);background:var(--group);
  box-shadow:var(--shadow-sm);font-size:13px;font-weight:500;white-space:nowrap}
.chip svg{font-size:15px;color:var(--c,var(--label2))}
.chip:hover{background:color-mix(in srgb,var(--group) 92%,var(--label))}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.chip[aria-pressed="true"] svg{color:#fff}

/* ================= panel / sheet ================= */
.panel{position:fixed;top:66px;left:12px;bottom:12px;width:380px;border-radius:var(--r-panel);display:flex;flex-direction:column;z-index:5;overflow:hidden}
.handle{display:none}
.panel-head{padding:10px 12px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:var(--r-ctl);padding:2px}
.seg button{height:26px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--label2);transition:background-color .2s,box-shadow .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--label);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05)}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 16px;scrollbar-width:thin;overscroll-behavior:contain}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--label2)}
.sec .meta{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.sec .link{text-transform:none;letter-spacing:0;font-weight:600;font-size:12px;color:var(--blue)}
.group{background:var(--group);border-radius:var(--r-card);overflow:hidden;box-shadow:0 0 0 .5px var(--hairline)}
.group + .group{margin-top:8px}

.hero{display:flex;align-items:flex-start;gap:10px;padding:2px 2px 4px}
.hero .tx{flex:1;min-width:0}
.hero h2{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.hero p{font-size:12.5px;color:var(--label2);margin-top:3px;display:flex;align-items:center;gap:6px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--label3);flex:none}
.sdot.on{background:var(--green)}
.wx{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:6px 9px;border-radius:var(--r-card);background:var(--group);box-shadow:0 0 0 .5px var(--hairline);min-width:74px}
.wx-t{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:700}
.wx-t svg{font-size:16px;color:#F5A623}
.wx-m{font-size:10.5px;color:var(--label2);display:flex;gap:6px;white-space:nowrap}
.wx-m i{font-style:normal;font-weight:600}

.item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px 9px 11px;text-align:left}
.item + .item{border-top:.5px solid var(--sep)}
button.item:hover{background:var(--hover)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{font-size:12px;color:var(--label2);text-align:right;white-space:nowrap;line-height:1.35}
.item .chev{color:var(--label3);font-size:13px}
.empty-note{padding:12px;font-size:12.5px;color:var(--label2)}
.skel{height:42px;margin:8px 12px;border-radius:4px;background:linear-gradient(90deg,var(--fill) 0%,var(--fill-strong) 50%,var(--fill) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:500;font-size:13px;padding:4px 2px;margin-bottom:6px}
.place-head{display:flex;gap:12px;align-items:flex-start}
.place-head .pico{width:40px;height:40px;border-radius:8px;font-size:22px}
.place-head h2{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.place-head p{font-size:13px;color:var(--label2);margin-top:2px}
.facts{display:flex;gap:8px;margin-top:12px}
.fact{flex:1;background:var(--group);border-radius:var(--r-card);box-shadow:0 0 0 .5px var(--hairline);padding:9px 10px}
.fact b{display:block;font-size:15px;font-weight:700}
.fact span{font-size:11px;color:var(--label2)}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;height:36px;border-radius:var(--r-ctl);background:var(--group);box-shadow:0 0 0 .5px var(--hairline);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background-color .15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--green);color:#fff;box-shadow:none}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--red)} .btn.accent{color:var(--blue)}
.btn svg{font-size:15px}
.btn:active,.icon-btn:active,.route:active,button.item:active,.chip:active{transform:scale(.985)}
.note{font-size:12px;color:var(--label2);padding:10px 2px 0;line-height:1.45}

/* trip */
.waypoints{position:relative}
.wp{display:flex;align-items:center;gap:12px;padding-left:13px;height:42px;width:100%;text-align:left}
.wp-txt{flex:1;height:100%;display:flex;align-items:center;gap:6px;padding-right:50px;min-width:0}
.wp + .wp .wp-txt{border-top:.5px solid var(--sep)}
.wp-k{color:var(--label2);width:38px;flex:none;font-size:13px}
.wp-v{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wp-v.ph{color:var(--blue)}
.wp-ico{width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center}
.wp-ico.start{background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.2)}
.wp-ico.start::after{content:"";width:6px;height:6px;border-radius:50%;background:#1d1d1f}
.wp-ico.me{background:var(--loc);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.3);width:12px;height:12px;margin:0 2px}
.wp-ico.end{background:var(--red)} .wp-ico.end::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.wp-dots{position:absolute;left:20px;top:31px;width:2px;height:22px;background:radial-gradient(circle,var(--label3) .9px,transparent 1.3px) 0 0/2px 5px}
.swap{position:absolute;right:9px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:var(--r-ctl);background:var(--fill);display:grid;place-items:center;color:var(--label2);font-size:15px}
.swap:hover{background:var(--fill-strong);color:var(--label)}
.row{display:flex;align-items:center;gap:11px;padding-left:11px;min-height:42px}
.sq{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:#fff;flex:none;font-size:14px}
.slider-col{flex:1;display:flex;flex-direction:column;padding:9px 13px 8px 0}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--label2)}
.slider-top b{color:var(--label);font-weight:600;font-size:14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;--p:80%;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:1.5px;background:linear-gradient(to right,var(--blue) var(--p),var(--fill-strong) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-9.5px;border-radius:4px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.12)}
input[type=range]::-moz-range-track{height:3px;border-radius:1.5px;background:var(--fill-strong)}
input[type=range]::-moz-range-progress{height:3px;border-radius:1.5px;background:var(--blue)}
input[type=range]::-moz-range-thumb{width:14px;height:22px;border:0;border-radius:4px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.12)}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--label2);margin-top:-3px}

.route{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px 11px 15px;text-align:left;transition:background-color .2s}
.route + .route{border-top:.5px solid var(--sep)}
.route:hover{background:var(--hover)}
button.item.on{background:var(--hover);box-shadow:inset 3px 0 0 #0A84FF}
.route.on.k-coolest{background:var(--green-tint)} .route.on.k-fastest{background:var(--orange-tint)} .route.on.k-alt{background:var(--blue-tint)}
.key{position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.35;transition:opacity .2s}
.route.on .key{opacity:1}
.r-body{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.r-top{display:flex;align-items:center;gap:8px}
.r-time{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.r-time small{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--label2)}
.tag-s{font-size:9.5px;font-weight:700;padding:2px 5px 1px;border-radius:var(--r-tag);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.tag-s.k-coolest{background:var(--green-tint);color:var(--green-ink)}
.tag-s.k-fastest{background:var(--orange-tint);color:var(--orange-ink)}
.tag-s.k-alt{background:var(--blue-tint);color:var(--blue)}
.r-meta{color:var(--label2);font-size:12.5px}
.r-meta b{font-weight:600;color:var(--label)}
.meter{height:3px;border-radius:1px;background:var(--fill-strong);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.tick{color:var(--blue);font-size:17px;opacity:0;transition:opacity .2s}
.tick svg{stroke-width:2.6}
.route.on .tick{opacity:1}
.insight{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-card);background:var(--green-tint);color:var(--green-ink);margin-top:8px;font-size:13px;line-height:1.4;box-shadow:inset 3px 0 0 var(--green)}
.insight.muted{background:var(--fill);color:var(--label2);box-shadow:inset 3px 0 0 var(--label3)}
.insight svg{font-size:16px;margin-top:1px}
.insight b{font-weight:600}
.insight button{color:var(--blue);font-weight:600}
.empty{text-align:center;padding:22px 14px 14px}
.empty .big{width:44px;height:44px;border-radius:var(--r-card);background:var(--blue-tint);color:var(--blue);display:grid;place-items:center;margin:0 auto 12px;font-size:20px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:4px}
.empty p{color:var(--label2);font-size:13px;margin-bottom:14px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--group);border-radius:var(--r-card);padding:11px 12px;box-shadow:0 0 0 .5px var(--hairline)}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em}
.stat span{font-size:11.5px;color:var(--label2);line-height:1.3;display:block;margin-top:2px}
.rank{width:22px;height:22px;border-radius:4px;background:var(--fill);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.item:nth-child(-n+3) .rank{background:var(--orange-tint);color:var(--orange-ink)}
.p-score{text-align:right;font-weight:700;font-size:15px}
.p-score small{display:block;font-size:9.5px;font-weight:600;color:var(--label2);letter-spacing:.06em;text-transform:uppercase}
.attr{font-size:10.5px;color:var(--label3);padding:14px 2px 0;line-height:1.4}

.tabbar{display:none}

/* ================= map buttons ================= */
.ctrls{position:fixed;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:4}
.ctrl{border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column}
.ctrl button{width:38px;height:38px;display:grid;place-items:center;color:var(--label2);font-size:17px;transition:background-color .15s,color .15s}
.ctrl button + button{border-top:.5px solid var(--sep)}
.ctrl button:hover{background:var(--fill);color:var(--label)}
.ctrl button[aria-pressed="true"]{color:var(--blue)}
.fabs{position:fixed;right:12px;bottom:34px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:4;transition:bottom .25s,opacity .2s}
.fab{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:20px;color:var(--label2)}
/* Google-style "my location" button: solid card, crosshair icon */
.fab.loc,.gbtn{background:var(--group);box-shadow:0 1px 4px rgba(0,0,0,.3);border:0}
.fab.loc{width:40px;height:40px;border-radius:6px;font-size:22px;color:#5F6368;transition:color .2s,background-color .15s}
.dark-ui .fab.loc{color:#BDC1C6}
.fab.loc:hover{background:color-mix(in srgb,var(--group) 92%,var(--label))}
.fab.loc .loc-dot{fill:none;stroke:none}
.fab.loc[data-state="on"],.fab.loc[data-state="follow"]{color:var(--loc)}
.fab.loc[data-state="on"] .loc-dot{stroke:currentColor}
.fab.loc[data-state="follow"] .loc-dot{fill:currentColor;stroke:currentColor}
.gbtn button{width:40px;height:40px}
.fab.loc[data-state="searching"] svg{animation:blinkf 1s infinite}
@keyframes blinkf{50%{opacity:.3}}
.fab.dir{background:var(--green);color:#fff;border:0;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}

.legend{position:fixed;bottom:12px;left:404px;transform:translateY(8px);opacity:0;pointer-events:none;border-radius:var(--r-card);padding:7px 12px;
  display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--label2);transition:opacity .25s,transform .25s;z-index:3;white-space:nowrap}
.legend.show{opacity:1;transform:none}
.legend b{color:var(--label);font-weight:600}
.legend .ramp{width:100px;height:5px;border-radius:1px;background:linear-gradient(to right,#E8710A,#E6C229,#1E9E47)}
.tag{position:fixed;top:56px;left:404px;padding:4px 8px;border-radius:var(--r-ctl);font-size:11px;font-weight:500;color:var(--label2);z-index:3;white-space:nowrap}
.toast{position:fixed;left:calc(50% + 196px);bottom:24px;transform:translate(-50%,10px);opacity:0;pointer-events:none;z-index:40;
  background:#1d1d1f;color:#fff;padding:9px 14px;border-radius:var(--r-card);font-size:13px;box-shadow:var(--shadow);transition:opacity .25s,transform .25s;max-width:min(420px,calc(100vw - 32px))}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= chat ================= */
.chat{position:fixed;right:12px;bottom:12px;width:360px;height:min(540px,calc(100vh - 24px));border-radius:var(--r-panel);display:flex;flex-direction:column;z-index:12;overflow:hidden;
  transform-origin:bottom right;animation:pop .22s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.chat header{display:flex;align-items:center;gap:10px;padding:12px 10px 11px 14px;border-bottom:.5px solid var(--sep)}
.chat-title{flex:1;min-width:0}
.chat h3{font-size:14px;font-weight:600}
.chat header p{font-size:11.5px;color:var(--label2)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;padding:7px 11px;border-radius:10px;font-size:14px;line-height:1.35;animation:pop .2s ease-out}
.msg{white-space:pre-wrap}
.msg.in{align-self:flex-start;background:var(--bubble-in);color:var(--bubble-in-ink);border-bottom-left-radius:3px}
.msg.out{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.typing{display:flex;gap:4px;padding:11px 13px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--label3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.35}40%{opacity:1}}
.qchips{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.qchips button{flex:none;height:28px;padding:0 10px;border-radius:var(--r-ctl);background:var(--group);box-shadow:0 0 0 .5px var(--hairline);color:var(--blue);font-size:12.5px;font-weight:500}
.composer{display:flex;gap:8px;align-items:center;padding:4px 12px 12px}
.composer input{flex:1;height:34px;border-radius:var(--r-ctl);border:.5px solid var(--sep);background:var(--group);padding:0 11px;outline:none;font-size:14px}
.composer input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint)}
.send{width:34px;height:34px;border-radius:var(--r-ctl);background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px}
.send:disabled{background:var(--fill-strong);cursor:default}

/* ================= time: Now / Plan ahead ================= */
.when{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.when-btn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:var(--r-ctl);background:var(--group);box-shadow:0 0 0 .5px var(--hairline);text-align:left;font-size:13px}
.when-btn:hover{background:var(--hover)}
.when-btn .wt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when-btn b{font-weight:600}
.when-btn .chev{color:var(--label3);font-size:13px;transition:transform .2s}
.when-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.when-btn .cal{color:var(--blue);font-size:15px;display:grid}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;animation:livep 2s infinite}
@keyframes livep{0%{box-shadow:0 0 0 0 rgba(30,158,71,.45)}70%{box-shadow:0 0 0 6px rgba(30,158,71,0)}100%{box-shadow:0 0 0 0 rgba(30,158,71,0)}}
.sun-pill{display:flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:var(--r-ctl);background:var(--group);box-shadow:0 0 0 .5px var(--hairline);font-size:12px;color:var(--label2);white-space:nowrap}
.sun-pill svg{font-size:15px;color:#F5A623}
.sun-pill.night svg{color:#8E9BC7}
.when-note{flex:1;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--r-ctl);background:var(--group);box-shadow:0 0 0 .5px var(--hairline);font-size:12px;color:var(--label2);line-height:1.35}
.when-note svg{font-size:15px;color:#F5A623;flex:none}
.when-panel{background:var(--group);border-radius:var(--r-card);box-shadow:0 0 0 .5px var(--hairline);padding:10px 12px 12px;margin:-4px 0 10px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:var(--r-ctl);padding:2px;margin-bottom:10px}
.seg2 button{height:26px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--label2)}
.seg2 button[aria-pressed="true"]{background:var(--seg-on);color:var(--label);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.wp-date input{width:100%;height:32px;border-radius:var(--r-ctl);border:.5px solid var(--sep);background:var(--group);padding:0 8px;font-size:13px;color:var(--label)}
.tl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;color:var(--label2);margin-top:8px}
.tl-top b{font-size:15px;color:var(--label);font-weight:700}
input.tl::-webkit-slider-runnable-track{background:var(--track)!important;height:6px;border-radius:1px}
input.tl::-webkit-slider-thumb{margin-top:-8px}
input.tl::-moz-range-track{background:var(--track);height:6px}
input.tl::-moz-range-progress{background:transparent}
.tl-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--label2);margin-top:-3px}
.qc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qc button{height:28px;padding:0 10px;border-radius:var(--r-ctl);background:var(--fill);font-size:12.5px;font-weight:500;color:var(--blue)}
.qc button:hover{background:var(--blue-tint)}
.advice{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--label2);padding:6px 2px 2px;line-height:1.4}
.advice svg{font-size:14px;margin-top:1px;flex:none;color:#F5A623}
.night-card{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-card);background:var(--fill);margin-top:8px;font-size:13px;color:var(--label2)}
.night-card svg{color:#8E9BC7;flex:none}
.night-card button,.insight button[data-jump]{margin-left:auto;color:var(--blue);font-weight:600;white-space:nowrap}
/* sun direction marker: sun on one side, shadows on the other */
.sunmk{width:150px;height:150px;pointer-events:none}
.sunmk .ray{position:absolute;left:50%;top:14px;width:2px;height:61px;margin-left:-1px;background:linear-gradient(to top,rgba(245,166,35,0),#F5A623)}
.sunmk .disc{position:absolute;left:50%;top:0;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#F7B733;box-shadow:0 0 0 3px rgba(247,183,51,.3),0 0 10px rgba(247,183,51,.8)}
.sunmk .shadow{position:absolute;left:50%;top:75px;width:2px;height:30px;margin-left:-1px;background:repeating-linear-gradient(to bottom,rgba(60,64,67,.6) 0 4px,transparent 4px 7px)}
.dark-ui .sunmk .shadow{background:repeating-linear-gradient(to bottom,rgba(232,234,237,.6) 0 4px,transparent 4px 7px)}
/* walking */
.walk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-card);background:var(--green);color:#fff;margin-bottom:10px}
.walk > svg{font-size:20px}
.walk .tx{flex:1;min-width:0} .walk b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .walk span{font-size:12px;opacity:.92}
.walk button{height:30px;padding:0 12px;border-radius:var(--r-ctl);background:rgba(255,255,255,.22);color:#fff;font-weight:600}
.reroute{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-card);background:var(--blue-tint);margin-bottom:10px;font-size:13px}
.reroute svg{color:var(--green);flex:none}
.reroute button{margin-left:auto;height:30px;padding:0 12px;border-radius:var(--r-ctl);background:var(--blue);color:#fff;font-weight:600}

/* ================= phone ================= */
@media (max-width:760px){
  .search{left:10px;right:10px;width:auto;top:calc(10px + env(safe-area-inset-top))}
  .chips{top:calc(64px + env(safe-area-inset-top));left:0;right:0;padding:1px 10px 6px}
  .ctrls{top:calc(110px + env(safe-area-inset-top));right:10px}
  .panel{top:auto;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));width:auto;height:var(--sheet-h);
    border-radius:var(--r-panel) var(--r-panel) 0 0;border-bottom:0;transition:height .3s cubic-bezier(.2,.8,.2,1),background-color .3s}
  .panel.dragging{transition:none}
  .handle{display:block;height:20px;flex:none;position:relative;cursor:grab;touch-action:none}
  .handle::after{content:"";position:absolute;left:50%;top:7px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--label3)}
  .panel-head{display:none}
  .panel-body{padding-top:2px}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding:6px 10px env(safe-area-inset-bottom);background:var(--material);border-top:.5px solid var(--sep);z-index:7;
    -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--label2)}
  .tabbar button span{display:grid;place-items:center;width:52px;height:26px;border-radius:var(--r-card);font-size:18px;transition:background-color .2s}
  .tabbar button[aria-pressed="true"]{color:var(--label);font-weight:600}
  .tabbar button[aria-pressed="true"] span{background:var(--green-tint);color:var(--green-ink)}
  .fabs{bottom:calc(var(--sheet-h) + var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);right:10px}
  .fabs .zoom{display:none}
  .fab.dir{display:grid}
  body.sheet-full .fabs{opacity:0;pointer-events:none}
  .maplibregl-ctrl-bottom-right{bottom:calc(var(--sheet-h) + var(--tabbar-h) + env(safe-area-inset-bottom));right:auto;left:0}
  .legend{top:calc(110px + env(safe-area-inset-top));left:10px;bottom:auto;transform:translateY(-6px)}
  .legend.show{transform:none}
  .tag{display:none}
  .toast{left:50%;bottom:calc(var(--sheet-h) + var(--tabbar-h) + 20px)}
  .chat{inset:8px;width:auto;height:auto}
}
/* ================= motion: smooth, Mac-like ================= */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.45,.64,1);--ease-sheet:cubic-bezier(.32,.72,0,1)}
.seg,.seg2{position:relative;isolation:isolate}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);border-radius:4px;background:var(--seg-on);pointer-events:none;z-index:-1;
  box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05);transform:translateX(calc(100% * var(--i, 0)));transition:transform .4s var(--ease-out),background-color .3s}
.seg2 .seg-thumb{width:calc((100% - 4px)/2)}
.seg button,.seg2 button{position:relative;transition:color .25s}
.seg button[aria-pressed="true"],.seg2 button[aria-pressed="true"]{background:transparent;box-shadow:none}
.tab-ind{display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes popBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes dropOut{to{opacity:0;transform:translateY(-6px) scale(.985)}}
@keyframes popOut{to{opacity:0;transform:scale(.96) translateY(6px)}}
@keyframes mkIn{from{opacity:0;scale:.55;translate:0 -10px}to{opacity:1;scale:1;translate:0 0}}
.anim-in > *{animation:rise .46s var(--ease-out) both}
.anim-in > :nth-child(2){animation-delay:.035s} .anim-in > :nth-child(3){animation-delay:.07s} .anim-in > :nth-child(4){animation-delay:.105s}
.anim-in > :nth-child(5){animation-delay:.14s} .anim-in > :nth-child(6){animation-delay:.175s} .anim-in > :nth-child(7){animation-delay:.21s}
.anim-in > :nth-child(n+8){animation-delay:.245s}
.anim-push{animation:pushIn .4s var(--ease-out) both}
.anim-pop{animation:popBack .4s var(--ease-out) both}
.results:not([hidden]),.when-panel:not([hidden]){animation:dropIn .24s var(--ease-out);transform-origin:top center}
.when-panel.closing{animation:dropOut .17s ease-in forwards}
.chat.closing{animation:popOut .18s ease-in forwards}
.mk-in{animation:mkIn .55s var(--ease-spring) both;transform-origin:50% 100%}
.legend{transition:opacity .35s var(--ease-out),transform .45s var(--ease-spring),background-color .3s}
.toast{transition:opacity .3s var(--ease-out),transform .45s var(--ease-spring)}
.btn,.chip,.icon-btn,.fab,.fab.loc,.ctrl button,.qc button,.res,.route,button.item,.when-btn,.swap{transition:transform .22s var(--ease-out),background-color .2s,color .2s,box-shadow .2s}
.btn:active,.chip:active,.icon-btn:active,.fab:active,.fab.loc:active,.ctrl button:active,.qc button:active,.when-btn:active{transform:scale(.95)}
.chip:hover{transform:translateY(-1px)}
.meter i{transition:width .6s var(--ease-out),background-color .3s}
.fab.loc svg{transition:transform .4s var(--ease-spring)}
.fab.loc[data-state="follow"] svg{transform:scale(1.08)}
@media (max-width:760px){
  .tab-ind{display:block;position:absolute;top:6px;width:52px;height:26px;border-radius:var(--r-card);background:var(--green-tint);pointer-events:none;
    left:calc(10px + (100% - 20px)/3*var(--i, 0) + ((100% - 20px)/3 - 52px)/2);transition:left .42s var(--ease-out)}
  .tabbar button[aria-pressed="true"] span{background:transparent}
  .tabbar button span{transition:color .25s,transform .3s var(--ease-spring)}
  .tabbar button[aria-pressed="true"] span{transform:scale(1.08)}
  .panel{transition:height .5s var(--ease-sheet),background-color .3s}
}
/* polish: chat springs, planner bars, skeletons, theme reveal */
.chat{animation:chatIn .46s var(--ease-spring)}
@keyframes chatIn{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:none}}
.msg.in{transform-origin:0 100%;animation:bubbleIn .44s var(--ease-spring) both}
.msg.out{transform-origin:100% 100%;animation:bubbleIn .44s var(--ease-spring) both}
@keyframes bubbleIn{from{opacity:0;transform:scale(.55) translateY(10px)}45%{opacity:1}to{opacity:1;transform:none}}
.typing i{animation:hop 1.2s var(--ease-out) infinite}
@keyframes hop{0%,55%,100%{transform:none;opacity:.4}25%{transform:translateY(-4px);opacity:1}}
.chat:not(.closing) .qchips button{animation:rise .42s var(--ease-out) both}
.qchips button:nth-child(2){animation-delay:.06s} .qchips button:nth-child(3){animation-delay:.12s} .qchips button:nth-child(4){animation-delay:.18s}
.send{transition:transform .25s var(--ease-spring),background-color .2s}
.send:not(:disabled){animation:sendOn .34s var(--ease-spring)}
.send:not(:disabled):active{transform:scale(.88)}
@keyframes sendOn{from{transform:scale(.75)}to{transform:none}}
.pbar{display:block;height:3px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden;max-width:200px}
.pbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#E6C229,#E8710A);transform-origin:left center}
.pl-rows.fresh > .item{animation:rise .46s var(--ease-out) both;animation-delay:calc(var(--k, 0) * 36ms)}
.pl-rows.fresh .pbar i{animation:grow .8s var(--ease-out) both;animation-delay:calc(var(--k, 0) * 36ms + .14s)}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.skel.sm{height:30px}
.pcode{display:inline-block;margin-left:2px;padding:0 5px;border-radius:4px;background:var(--fill);color:var(--label2);font:500 11.5px/18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;vertical-align:1px}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const params = new URLSearchParams(location.search);
const isPhone = () => innerWidth <= 760;

/* ============================================================
   Data sources (all free, no API key needed)
   Map tiles + fonts: OpenFreeMap (OpenStreetMap data, OpenMapTiles schema)
   Search: Photon · Walking routes: FOSSGIS OSRM · Weather/air: Open-Meteo
   ============================================================ */
let TILES  = 'https://tiles.openfreemap.org/planet';
let GLYPHS = 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf';
/* Offline region: when this page is served by your backend (/app) or opened with ?api=http://localhost:8000,
   map tiles, street shade, walking routes and search all come from the laptop, so it works without internet. */
/* Where the backend is: ?api=..., or the <meta name="shade-api"> tag (set this for the deployed site), or the backend itself (/app) */
const API = (new URLSearchParams(location.search).get('api') || (document.querySelector('meta[name="shade-api"]') || {}).content
  || (/^\/app\/?$/.test(location.pathname) ? location.origin : '')).replace(/\/$/, '');
let REGION = null;
let regionReq = null;
function initRegion(){            /* starts loading the region info; the map waits at most 3 s for it */
  if (!API) return Promise.resolve();
  regionReq = regionReq || (async () => {
    for (let attempt = 0; attempt < 3 && !REGION; attempt++){
      try {
        const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 30000);   /* a cold AWS Lambda can take ~10-20 s */
        const r = await fetch(API + '/api/region/info', {signal:ctl.signal}); clearTimeout(tm);
        if (r.ok){ applyRegion(await r.json()); break; }
      } catch (e) {}
    }
  })();
  return Promise.race([regionReq, new Promise(res => setTimeout(res, 3000))]);
}
function applyRegion(info){
  REGION = info;
  if (REGION.basemap && !mapReady && !map){ TILES = API + '/offline/tiles.json'; GLYPHS = API + '/offline/fonts/{fontstack}/{range}.pbf'; }   /* laptop: saved map */
  AREAS = [{key:REGION.key, name:REGION.name, lng:REGION.center[1], lat:REGION.center[0], r:REGION.radius, region:true}];
  $('#legendLabel').textContent = 'Shade';
  $('.chat-title p').textContent = 'Amazon Bedrock · answers from the shade data';
  const qs = ['Shadiest way to the nearest metro', 'When is it shadiest here today?', 'Where should trees go here?'];
  $$('.qchips button').forEach((b, i) => { b.textContent = qs[i] || b.textContent; });
  $('#msgs').firstElementChild.textContent = 'Hi! Ask me for a shady walk to anywhere in ' + REGION.name.split(' (')[0] + ', when a street is coolest, or where trees are needed.';
  $('#dataTag').textContent = (REGION.basemap ? 'Offline data · ' : 'Live data · ') + REGION.name;
  if (mapReady){
    map.getSource('areas').setData(areasFC()); map.getSource('area-pts').setData(areaPtsFC());
    shadeSegs.clear(); segGrid.clear(); map.getSource('shade').setData(EMPTY);
    updateShadePaint(); applyShadeVisibility(); scheduleNearby(true);
  }
  renderExplore();
}
const whenISO = d => new Date(d.getTime() + 5.5*3600e3).toISOString().slice(0, 16) + '+05:30';   /* Delhi time */
const PHOTON = 'https://photon.komoot.io';
const OSRM   = 'https://routing.openstreetmap.de/routed-foot/route/v1/driving';
const METEO  = 'https://api.open-meteo.com/v1/forecast';
const AIR    = 'https://air-quality-api.open-meteo.com/v1/air-quality';

/* Shade-data areas. SAMPLE positions: in the real app these come from your backend (/api/areas). */
let AREAS = [
  {key:'chandni_chowk',   name:'Chandni Chowk',   lng:77.2302, lat:28.6562, r:850},
  {key:'connaught_place', name:'Connaught Place', lng:77.2167, lat:28.6315, r:850},
  {key:'lajpat_nagar',    name:'Lajpat Nagar',    lng:77.2433, lat:28.5677, r:850},
];
/* ---------- time + sun (SunCalc formulas) ---------- */
const RADS = Math.PI/180, DAY_MS = 864e5, J1970 = 2440588, J2000 = 2451545, OBL = RADS*23.4397, J0 = 0.0009;
const toDays = d => d.valueOf()/DAY_MS - 0.5 + J1970 - J2000;
const meanAnom = d => RADS*(357.5291 + 0.98560028*d);
const eclLng = M => M + RADS*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M)) + RADS*102.9372 + Math.PI;
function sunPos(date, lat, lng){
  const lw = -lng*RADS, phi = lat*RADS, d = toDays(date), L = eclLng(meanAnom(d));
  const dec = Math.asin(Math.sin(OBL)*Math.sin(L)), ra = Math.atan2(Math.sin(L)*Math.cos(OBL), Math.cos(L));
  const H = RADS*(280.16 + 360.9856235*d) - lw - ra;
  const alt = Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(dec)*Math.cos(phi));
  return {alt: alt/RADS, az: (az/RADS + 540) % 360};   /* az: compass bearing from north */
}
function sunTimes(date, lat, lng){
  const lw = -lng*RADS, phi = lat*RADS, noon = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  const n = Math.round(toDays(noon) - J0 - lw/(2*Math.PI)), ds = J0 + lw/(2*Math.PI) + n;
  const M = meanAnom(ds), L = eclLng(M), dec = Math.asin(Math.sin(OBL)*Math.sin(L));
  const transit = a => J2000 + a + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L), fromJ = j => new Date((j + 0.5 - J1970)*DAY_MS);
  const w = Math.acos(clamp((Math.sin(-0.833*RADS) - Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)), -1, 1));
  const Jnoon = transit(ds), Jset = transit(J0 + (w + lw)/(2*Math.PI) + n);
  return {rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset)};
}
/* SAMPLE shade model, fitted to your Chandni Chowk output (12% at noon, 17% at 8 AM, 26% at 6 PM in May):
   the lower the sun, the longer the shadows. The real app will read your pre-built monthly shade data instead. */
const areaShadePct = alt => alt <= 0 ? null : Math.min(60, 12 + 3.05*(1/Math.tan(Math.max(alt, 4)*RADS) - 0.105));
const fmtTime = d => d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
function fmtDay(d){
  const t = new Date(), tm = new Date(t); tm.setDate(t.getDate() + 1);
  if (d.toDateString() === t.toDateString()) return 'Today';
  if (d.toDateString() === tm.toDateString()) return 'Tomorrow';
  return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
}
const fmtWhen = d => `${fmtDay(d)}, ${fmtTime(d)}`;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const roundTo15 = d => { const n = new Date(d); n.setMinutes(Math.round(n.getMinutes()/15)*15, 0, 0); return n; };
const compass = az => ['north','north-east','east','south-east','south','south-west','west','north-west'][Math.round(az/45) % 8];

/* ---------- 24px stroke glyphs ---------- */
const G = {
  leaf:'M5 19C5 10.5 10.5 5 19 5c0 8.5-5.5 14-14 14Z M5 19 13 11',
  food:'M6.5 3v6a2 2 0 0 0 4 0V3 M8.5 9v12 M17 3c-2 1.4-2.6 4-2.6 7.5H17V21',
  cafe:'M4.5 9.5h11v4.5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5Z M15.5 10.5h1.2a2.6 2.6 0 0 1 0 5.2h-1.2 M8 3.5v2.5 M11.5 3.5v2.5',
  park:'M12 3a5 5 0 0 0-4.7 6.7A4.2 4.2 0 0 0 8.8 17.5h6.4a4.2 4.2 0 0 0 1.5-7.8A5 5 0 0 0 12 3Z M12 12.5V21',
  transit:'M7.5 3.5h9a2.5 2.5 0 0 1 2.5 2.5v8a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a2.5 2.5 0 0 1 2.5-2.5Z M5 10.5h14 M9 14h.01 M15 14h.01 M8.5 21l1.5-3.5 M15.5 21 14 17.5',
  shop:'M5 8.5h14l-1.2 12H6.2Z M9 8.5V7a3 3 0 0 1 6 0v1.5',
  sights:'M3.5 20.5h17 M5 10h14 M12 3.5l8 5H4Z M7 10v8 M12 10v8 M17 10v8',
  health:'M12 5.5v13 M5.5 12h13',
  pin:'M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z M12 7.7a2.3 2.3 0 1 0 0 4.6 2.3 2.3 0 1 0 0-4.6',
  sparkle:'M11 3c.6 3.9 2.1 5.4 6 6-3.9.6-5.4 2.1-6 6-.6-3.9-2.1-5.4-6-6 3.9-.6 5.4-2.1 6-6Z M18.5 14.5c.3 1.8 1 2.5 2.8 2.8-1.8.3-2.5 1-2.8 2.8-.3-1.8-1-2.5-2.8-2.8 1.8-.3 2.5-1 2.8-2.8Z',
  chev:'m9 6 6 6-6 6', back:'m15 6-6 6 6 6', check:'m6 12.5 4 4 8-9',
  swap:'M8 20V4M4.5 7.5 8 4l3.5 3.5M16 4v16m-3.5-3.5L16 20l3.5-3.5',
  dir:'M12 2.5 21.5 12 12 21.5 2.5 12 12 2.5Z M9 14v-2.5a1.5 1.5 0 0 1 1.5-1.5H15m-2-2 2 2-2 2',
  share:'M12 15V3.5 M8 7.5l4-4 4 4 M5 12v7.5h14V12',
  sun:'M12 8a4 4 0 1 0 0 8 4 4 0 1 0 0-8Z M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4',
  cloud:'M7 18.5h10a4 4 0 0 0 .6-8A5.5 5.5 0 0 0 7 11a3.8 3.8 0 0 0 0 7.5Z',
  moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z',
  loc:'M20 4 4 11l7 2 2 7 7-16Z',
  cal:'M4 6h16v14H4Z M4 10h16 M8 3.5v4 M16 3.5v4',
  walk:'M13 3.5a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 1 0 0-3.2Z M10.5 21l1.8-5.5 2.7 2.7V21 M12.3 15.5l1-5.2-2.8 1.2-1.5 3 M13.3 10.3l1.7 2.7 2.5.8',
};
const svgI = name => `<svg class="i" viewBox="0 0 24 24"><path d="${G[name]}"/></svg>`;

/* ---------- place categories, mapped to OpenMapTiles `poi` classes ---------- */
const CATS = {
  park:    {label:'Parks & gardens',  one:'Park',       glyph:'park',    color:'#1E8E3E', ink:['#137333','#81C995'], classes:['park','garden','playground','picnic_site','zoo','nature_reserve','dog_park']},
  cafe:    {label:'Cafés',            one:'Café',       glyph:'cafe',    color:'#E8710A', ink:['#B45309','#FDBA74'], classes:['cafe','bakery','ice_cream']},
  food:    {label:'Restaurants',      one:'Restaurant', glyph:'food',    color:'#E8710A', ink:['#B45309','#FDBA74'], classes:['restaurant','fast_food','food_court','bar','beer','pub','biergarten']},
  transit: {label:'Metro & rail',     one:'Station',    glyph:'transit', color:'#3F51B5', ink:['#3949AB','#AAB4F2'], classes:['railway']},
  shop:    {label:'Shopping',         one:'Shop',       glyph:'shop',    color:'#1A73E8', ink:['#1967D2','#8AB4F8'], classes:['shop','grocery','clothing_store','marketplace','mall','department_store','jewelry','books']},
  sights:  {label:'Sights & worship', one:'Landmark',   glyph:'sights',  color:'#0E9AA7', ink:['#0B7A84','#78D9E0'], classes:['place_of_worship','attraction','museum','castle','monument','memorial','art_gallery','viewpoint','theatre','cinema']},

};
const CHIP_ORDER = ['park','cafe','food','transit','shop','sights','health'];
const CLASS_TO_CAT = {}; for (const [k, c] of Object.entries(CATS)) for (const cl of c.classes) CLASS_TO_CAT[cl] = k;

const RANK_CLASSES = ALL_CLASSES.filter(c => c !== 'railway');

const OSM_VALUE_TO_CAT = {cafe:'cafe',bakery:'cafe',ice_cream:'cafe',restaurant:'food',fast_food:'food',food_court:'food',bar:'food',pub:'food',park:'park',garden:'park',playground:'park',

  station:'Station',subway:'Metro station',halt:'Station',picnic_site:'Picnic site',art_gallery:'Art gallery',department_store:'Department store'}[s]
  || (s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g,' ')));

/* ---------- geo helpers ---------- */
const rad = d => d*Math.PI/180;
function dist(a, b){ const dLat = rad(b.lat-a.lat), dLng = rad(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2; return 2*6371000*Math.asin(Math.sqrt(h)); }
const fmtDist = m => m < 950 ? `${Math.max(10, Math.round(m/10)*10)} m` : `${(m/1000).toFixed(m < 9500 ? 1 : 0)} km`;

/* POI layers. Ranked like Google: important places first, the rest as you zoom in. */
const POI_RANKS = [{id:'poi-1', minzoom:14.5}, {id:'poi-2', minzoom:15.5}, {id:'poi-3', minzoom:16.5}];
const classFilter = classes => ['match', ['get','class'], classes, true, false];
const PRIORITY = ['park','cafe','food','sights'].flatMap(k => CATS[k].classes), SECONDARY = ['shop','health'].flatMap(k => CATS[k].classes);
const rk = (op, n) => [op, ['get','rank'], n];
const NONE = ['==', ['get','class'], '__none__'];
function poiFilter(r){
  const named = ['has','name'];
  if (state.cat === 'transit') return NONE;
  if (state.cat){ const c = classFilter(CATS[state.cat].classes);
    return r.id === 'poi-1' ? ['all', named, rk('<', 6), c] : r.id === 'poi-2' ? ['all', named, rk('>=', 6), c] : NONE; }
  if (r.id === 'poi-1') return ['all', named, rk('<', 6), classFilter(RANK_CLASSES)];
  if (r.id === 'poi-2') return ['all', named, rk('>=', 6), ['any', classFilter(PRIORITY), ['all', classFilter(SECONDARY), rk('<', 14)]]];
  return ['all', named, rk('>=', 14), classFilter(SECONDARY)];
}
function iconExpr(){ const e = ['match', ['get','class']]; for (const k of CHIP_ORDER) e.push(CATS[k].classes, 'i-' + k); e.push('i-pin'); return e; }
function inkExpr(P){ const d = P === PAL.dark ? 1 : 0; const e = ['match', ['get','class']]; for (const k of CHIP_ORDER) e.push(CATS[k].classes, CATS[k].ink[d]); e.push(P.labelMinor); return e; }
function poiLayers(P){

    'text-variable-anchor':['left','right','top','bottom'], 'text-radial-offset':1.05, 'text-justify':'auto', 'text-optional':true, 'icon-padding':3, 'text-padding':3, 'symbol-sort-key':['match', ['get','class'], PRIORITY, ['/', ['get','rank'], 3], ['+', ['get','rank'], 6]]};
  const paint = {'text-color':inkExpr(P), 'text-halo-color':P.halo, 'text-halo-width':1.4};
  const layers = POI_RANKS.map(r => ({id:r.id, type:'symbol', source:'omt', 'source-layer':'poi', minzoom:r.minzoom, filter:poiFilter(r), layout, paint}));
  layers.reverse(); /* top layer = placed first, so most important goes on top */

    layout:{'icon-image':['concat', 'i-', ['get','cat']], 'icon-allow-overlap':true, 'text-field':['step', ['zoom'], '', 14, ['get','name']],
      'text-font':F_REG, 'text-size':11.5, 'text-max-width':8, 'text-variable-anchor':['left','right','top','bottom'], 'text-radial-offset':1.05, 'text-optional':true},
    paint:{'text-color':['match', ['get','cat'], ...CHIP_ORDER.flatMap(k => [k, CATS[k].ink[P === PAL.dark ? 1 : 0]]), P.labelMinor],
      'text-halo-color':P.halo, 'text-halo-width':1.4}});

/* App layers: shade-data areas, sample shade colours, routes, location accuracy */
function shadeColorExpr(P){
  if (REGION) return ['interpolate', ['linear'], ['to-number', ['get','shade'], 0], 0, P.sunny, 0.45, P.mid, 0.8, P.shady];
  const az = sunNow().az*RADS;   /* streets running across the sun's direction get more building shade */
  const orient = ['+', 0.55, ['*', 0.75, ['abs', ['sin', ['-', az, ['to-number', ['get','brg'], 0]]]]]];
  const v = ['min', 1, ['max', 0, ['+', ['*', ['get','b'], kf(), orient], ['get','j']]]];
  return ['interpolate', ['linear'], v, 0, P.sunny, 0.45, P.mid, 0.8, P.shady];
}
function segShade(b, j, brg, sun){ return clamp(b*((areaShadePct(sun.alt) ?? 0)/16)*(0.55 + 0.75*Math.abs(Math.sin(sun.az*RADS - brg))) + j, 0, 1); }

/* ---------- POI icons drawn on canvas: sharp rounded squares ---------- */
function makeIcon(color, glyph){
  const ratio = 2, px = 24*ratio, c = document.createElement('canvas'); c.width = c.height = px;
  const ctx = c.getContext('2d'); ctx.scale(ratio, ratio);
  const rr = (x, y, w, h, r) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };
  ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 2; ctx.shadowOffsetY = 0.6;
  rr(2, 2, 20, 20, 5); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  rr(3.5, 3.5, 17, 17, 3.6); ctx.fillStyle = color; ctx.fill();
  ctx.save(); ctx.translate(6, 6); ctx.scale(0.5, 0.5);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const part of G[glyph].split(/ (?=M)/)) ctx.stroke(new Path2D(part));
  ctx.restore();
  return ctx.getImageData(0, 0, px, px);
}
function addIcons(){
  for (const k of CHIP_ORDER) if (!map.hasImage('i-' + k)) map.addImage('i-' + k, makeIcon(CATS[k].color, CATS[k].glyph), {pixelRatio:2});
  if (!map.hasImage('i-pin')) map.addImage('i-pin', makeIcon('#7A7F87', 'pin'), {pixelRatio:2});
}

let wxAt = null, wxKey = '', wxData = null, wxTime = 0;

function wxHTML(){

let nearby = [], lastNear = null, nearPending = false;

let regionTotals = {}, regionLimit = 50, regionSeq2 = 0;
async function fetchRegionNearby(){

  try {
    const r = await fetch(`${API}/api/region/nearby?lat=${o.lat}&lon=${o.lng}&cats=${cats.join(',')}&limit=${state.cat ? regionLimit : 4}`);
    if (!r.ok || seq !== regionSeq2) return;
    const j = await r.json(); if (seq !== regionSeq2) return;
    regionTotals = {}; const out = [];
    for (const [k, v] of Object.entries(j)){
      regionTotals[k] = v.total;
      for (const p of v.items) out.push({name:p.name, lng:p.lon, lat:p.lat, cls:p.class, cat:k, d:p.dist_m,
        kind: p.class === 'metro' ? 'Metro station' : p.class === 'station' ? 'Station' : prettySub(p.class)});
    }

    if (mapReady && map.getSource('region-poi')) map.getSource('region-poi').setData(state.cat ? {type:'FeatureCollection',
      features: out.map(p => ({type:'Feature', properties:{name:p.name, cat:p.cat, cls:p.cls}, geometry:{type:'Point', coordinates:[p.lng, p.lat]}}))} : EMPTY);
    if (state.view === 'explore') renderExplore(); else renderHero();
  } catch (e) {}
}

  let feats = [];
  try { feats = map.querySourceFeatures('omt', {sourceLayer:'poi', filter:['all', ['has','name'], classFilter(ALL_CLASSES)]}); } catch (e) {}
  for (const f of feats){
    if (f.properties.class === 'railway' && !STATION_SUBS.includes(f.properties.subclass)) continue;
    const p = featToPlace(f); if (!p || !p.name) continue;
    const key = p.name + '|' + p.lng.toFixed(4) + '|' + p.lat.toFixed(4); if (seen.has(key)) continue; seen.add(key);
    p.d = dist(o, p); if (p.d > 4000) continue; out.push(p);

    const j = await r.json(); if (seq !== plannerSeq) return;

  plHiStop = tween(950, k => src.setData(drawOn(fc, k)), () => { plHiStop = null; });
  const pts = row.lines.flat(), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  map.fitBounds([[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]], {padding:camPad(), maxZoom:17, duration:900});
}
function renderPlannerLive(el){
  const d = plannerData || {loading:true}, km = n => n.toLocaleString('en-IN');

  if (d.loading){ el.innerHTML = `<div class="sec" style="padding-top:4px"><span>Finding the streets that need shade most…</span></div>
    <div class="stats"><div class="skel stat-skel"></div><div class="skel stat-skel"></div></div>

  if (d.error){ el.innerHTML = `<p class="note" style="padding:6px 2px">${esc(d.error)}</p>`; return; }
  const at = new Date(d.at), fresh = motionOK() && el._area !== d.area;
  el._area = d.area;
  el.innerHTML = `${d.dark ? `<div class="when-note" style="margin:0 0 8px">${svgI('sun')}<span>The sun is too low at your chosen time, so the planner shows ${fmtDay(at)} at 2:00 PM.</span></div>` : ''}
    <div class="sec" style="padding-top:4px"><span>This area at ${fmtTime(at)}</span><span class="meta">${esc(fmtDay(at))}</span></div>
    <div class="stats"><div class="stat">${countHTML('pl-avg', d.avg_shade_pct, '%')}<span>average street shade (${km(d.km)} km of walking streets)</span></div>

    ${d.rows.length ? `<div class="group pl-rows${fresh ? ' fresh' : ''}">${d.rows.map((p, k) => `<button class="item" data-pl="${k}" style="--k:${k}"><span class="rank num">${k + 1}</span><span class="tx"><span class="t">${p.code ? `${esc(p.name.slice(0, -p.code.length - 1))} <span class="pcode" title="ID for a path with no name. It is a Plus Code: paste it into Google Maps to find the spot.">${esc(p.code)}</span>` : esc(p.name)}</span>
      <span class="s num">${km(p.length_m)} m · ${p.shade_pct}% shade${p.trees ? ` → ${p.shade_after_pct}% with ${p.trees} trees` : ''}</span>
      <span class="pbar" aria-hidden="true"><i style="width:${Math.max(3, p.score)}%"></i></span></span><span class="p-score num">${p.score}<small>score</small></span></button>`).join('')}</div>`

    <p class="note">Ranks the streets on screen by how much of them is in the sun at the chosen time, weighted by how busy that kind of street usually is. Tap one to see it. Move the map to plan another area.</p>${attrHTML()}`;

}
function renderPlanner(){
  const el = $('#v-planner');
  if (REGION) return renderPlannerLive(el);
  el.innerHTML = `<div class="sec" style="padding-top:4px"><span>Overview</span><span class="meta">Lajpat Nagar sample</span></div>
    <div class="stats"><div class="stat"><b class="num">20,000</b><span>walking trips simulated</span></div>
      <div class="stat"><b class="num">45%</b><span>of busy streets under 20% shade at 2&nbsp;PM</span></div></div>

    <div class="group">${PL.map((p, k) => `<div class="item"><span class="rank num">${k + 1}</span><span class="tx"><span class="t">${esc(p[0])}</span>
      <span class="s num">${p[2]} trips/day · ${p[3]}% shade at 2 PM</span></span><span class="p-score num">${p[1]}<small>score</small></span></div>`).join('')}</div>
    <p class="note">Priority combines how many people walk a street with how little shade it gets in the afternoon.</p>${attrHTML()}`;
}

/* ---------- sample shade colours: every street inside a shade area, cut at the circle edge ---------- */
const SHADE_CLASSES = ['path','minor','service','track','tertiary','secondary','primary','trunk'];
const SHADE_BY_CLASS = {path:0.7, service:0.62, track:0.62, minor:0.55, tertiary:0.4, secondary:0.3};
const shadeSegs = new Map(), segGrid = new Map();
function gridAdd(feat){
  const c = feat.geometry.coordinates, seen = new Set(), add = p => { const k = Math.floor(p[0]*500) + ',' + Math.floor(p[1]*500);
    if (seen.has(k)) return; seen.add(k); if (!segGrid.has(k)) segGrid.set(k, []); segGrid.get(k).push(feat); };
  for (let i = 1; i < c.length; i++){ const n = Math.max(1, Math.ceil(dist({lng:c[i-1][0], lat:c[i-1][1]}, {lng:c[i][0], lat:c[i][1]})/80));
    for (let k = 0; k <= n; k++) add([c[i-1][0] + (c[i][0] - c[i-1][0])*k/n, c[i-1][1] + (c[i][1] - c[i-1][1])*k/n]); }
}
function straightPieces(run){
  const out = []; let cur = [run[0]], b0 = null;
  for (let i = 1; i < run.length; i++){
    const b = bearingAx(run[i-1], run[i]);
    if (b0 !== null && axDiff(b, b0) > 0.35){ out.push(cur); cur = [run[i-1]]; b0 = null; }
    cur.push(run[i]); if (b0 === null) b0 = b;
  }
  out.push(cur); return out.filter(p => p.length > 1);
}
function hash01(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
function clipToCircle(coords, a){
  const k = 111320*Math.cos(rad(a.lat)), xy = c => [(c[0] - a.lng)*k, (c[1] - a.lat)*110540], ll = p => [a.lng + p[0]/k, a.lat + p[1]/110540];
  const r2 = a.r*a.r, runs = []; let run = null;
  for (let i = 1; i < coords.length; i++){
    const p = xy(coords[i-1]), q = xy(coords[i]), pin = p[0]**2 + p[1]**2 <= r2, qin = q[0]**2 + q[1]**2 <= r2;
    if (pin && qin){ if (!run){ run = [coords[i-1]]; runs.push(run); } run.push(coords[i]); continue; }
    const dx = q[0] - p[0], dy = q[1] - p[1], A = dx*dx + dy*dy, B = 2*(p[0]*dx + p[1]*dy), C = p[0]**2 + p[1]**2 - r2, D = B*B - 4*A*C;
    if (!A || D < 0){ run = null; continue; }
    const sq = Math.sqrt(D), t1 = (-B - sq)/(2*A), t2 = (-B + sq)/(2*A), at = t => ll([p[0] + dx*t, p[1] + dy*t]);
    if (pin){ if (!run){ run = [coords[i-1]]; runs.push(run); } run.push(at(clamp(t2, 0, 1))); run = null; }
    else if (qin){ run = [at(clamp(t1, 0, 1)), coords[i]]; runs.push(run); }
    else { if (t1 > 0 && t2 < 1) runs.push([at(t1), at(t2)]); run = null; }
  }
  return runs;
}
let regionBox = null, regionKey = '', regionSeq = 0;
async function loadRegionShade(){
  const on = (state.shade || state.view === 'planner') && !isNight();
  if (!mapReady || !on || map.getZoom() < 14.3) return;
  const b = map.getBounds(), key = whenISO(new Date(Math.round(nowT().getTime()/9e5)*9e5));   /* refresh every 15 min of shown time */
  const inside = regionBox && b.getWest() >= regionBox[0] && b.getSouth() >= regionBox[1] && b.getEast() <= regionBox[2] && b.getNorth() <= regionBox[3];
  if (inside && key === regionKey) return;
  const cx = (b.getWest() + b.getEast())/2, cy = (b.getSouth() + b.getNorth())/2;
  const hw = Math.min(0.016, (b.getEast() - b.getWest())*0.65), hh = Math.min(0.016, (b.getNorth() - b.getSouth())*0.65);
  const box = [cx - hw, cy - hh, cx + hw, cy + hh], seq = ++regionSeq;
  try {
    const r = await fetch(`${API}/api/region/shade?west=${box[0]}&south=${box[1]}&east=${box[2]}&north=${box[3]}&when=${encodeURIComponent(key)}`);
    if (!r.ok || seq !== regionSeq) return;
    const fc = await r.json(); if (seq !== regionSeq) return;
    regionBox = box; regionKey = key; segGrid.clear();
    for (const f of fc.features){ const c = f.geometry.coordinates; f.properties.brg = bearingAx(c[0], c[c.length - 1]); gridAdd(f); }
    map.getSource('shade').setData(fc);
    const t = state.trip;
    if (t && t.routes && t.routes.length && t.routes.some(x => x.serverShade == null)){ scoreTrip(t); if (state.view === 'routes') renderRouteList(); }
  } catch (e) {}
}
function harvestShade(){
  if (REGION) return loadRegionShade();
  if (!mapReady || map.getZoom() < 12.5) return;
  const vb = map.getBounds();
  const near = AREAS.filter(a => { const dLng = a.r/(111320*Math.cos(rad(a.lat))), dLat = a.r/110540;
    return a.lng + dLng >= vb.getWest() && a.lng - dLng <= vb.getEast() && a.lat + dLat >= vb.getSouth() && a.lat - dLat <= vb.getNorth(); });
  if (!near.length) return;
  let feats = []; try { feats = map.querySourceFeatures('omt', {sourceLayer:'transportation', filter:cls(...SHADE_CLASSES)}); } catch (e) { return; }
  let added = 0;
  for (const f of feats){
    const g = f.geometry; if (!g) continue;
    const parts = g.type === 'LineString' ? [g.coordinates] : g.type === 'MultiLineString' ? g.coordinates : null; if (!parts) continue;
    const b = SHADE_BY_CLASS[f.properties.class] ?? 0.18;
    for (const a of near) for (const part of parts) for (const run of clipToCircle(part, a)) for (const pc of straightPieces(run)){
      const s0 = pc[0], s1 = pc[pc.length - 1];
      const key = `${s0[0].toFixed(5)},${s0[1].toFixed(5)}|${s1[0].toFixed(5)},${s1[1].toFixed(5)}`;
      if (shadeSegs.has(key)) continue;
      const feat = {type:'Feature', properties:{b, j:0.24*(hash01(String(f.id ?? key)) - 0.5), brg:bearingAx(s0, s1)}, geometry:{type:'LineString', coordinates:pc}};
      shadeSegs.set(key, feat); gridAdd(feat); added++;
    }
  }
  if (added){
    map.getSource('shade').setData({type:'FeatureCollection', features:[...shadeSegs.values()]});
    const t = state.trip;   /* more street data → better route shade estimates */
    if (t && t.routes && t.routes.length){ scoreTrip(t); if (!t.userSel) t.sel = defaultSel(t); if (state.view === 'routes'){ renderRouteList(); drawTrip(); } renderWalkBar(); }
  }
}

/* ---------- shade layer + map buttons ---------- */
function toggleShade(){ state.shade = !state.shade; applyShadeVisibility(); if (state.view === 'routes') renderRouteList(); }
function applyShadeVisibility(){
  const on = (state.shade || state.view === 'planner') && !isNight();
  if (mapReady){ fadeLayer('shade-sample', on); if (on) harvestShade(); }
  $('#legend').classList.toggle('show', on); $('#layerBtn').setAttribute('aria-pressed', on);
  $('#legendTime').textContent = state.view === 'planner' && !REGION ? '2:00 PM' : fmtTime(nowT());
}
$('#layerBtn').onclick = () => {
  if (state.view === 'planner') return toast('The shade layer stays on in Planner.');
  if (isNight()) return toast(`The sun is down. Shade colours come back at sunrise (${fmtTime(nextRise(nowT(), origin()))}).`);
  toggleShade(); if (state.shade && !areaAt(origin())) toast('Shade colours appear inside the green dashed shade-data areas.');
};
$('#zin').onclick = () => map && map.zoomIn();
$('#zout').onclick = () => map && map.zoomOut();
$('#compass').onclick = () => map && map.resetNorth();
$('#dirBtn').onclick = () => {
  if (state.place) return directionsTo(state.place);
  if (!state.trip) state.trip = {from:meAsPoint(), to:null, routes:[], sel:0};
  setView('routes', {sheet:'half'}); if (!state.trip.to || !state.trip.from) { startPick(state.trip.from ? 'to' : 'from'); qEl.focus(); }
};

/* ============================================================
   Bottom sheet (phone)
   ============================================================ */
const panel = $('#panel'), handle = $('#handle');
const sheetSizes = () => ({peek:196, half:Math.round(innerHeight*0.46), full:Math.round(innerHeight - 150)});
const sheetPx = () => isPhone() ? sheetSizes()[state.sheet] : 0;
function setSheet(s){ state.sheet = s; root.style.setProperty('--sheet-h', sheetSizes()[s] + 'px'); document.body.classList.toggle('sheet-full', s === 'full'); }
let sDrag = null;
handle.addEventListener('pointerdown', e => { if (!isPhone()) return; sDrag = {y:e.clientY, h:panel.getBoundingClientRect().height, moved:false, ly:e.clientY, lt:performance.now(), v:0};
  panel.classList.add('dragging'); handle.setPointerCapture(e.pointerId); });
handle.addEventListener('pointermove', e => { if (!sDrag) return; const dy = sDrag.y - e.clientY, now = performance.now(); if (Math.abs(dy) > 4) sDrag.moved = true;
  sDrag.v = 0.7*sDrag.v + 0.3*((sDrag.ly - e.clientY)/Math.max(1, now - sDrag.lt)); sDrag.ly = e.clientY; sDrag.lt = now;
  const S = sheetSizes(); let h = sDrag.h + dy;
  if (h > S.full) h = S.full + (h - S.full)*0.3; if (h < S.peek) h = S.peek - (S.peek - h)*0.3;   /* rubber band at the ends */
  root.style.setProperty('--sheet-h', h + 'px'); });
const endSheetDrag = () => { if (!sDrag) return; panel.classList.remove('dragging');
  const h = panel.getBoundingClientRect().height, S = sheetSizes(), order = ['peek','half','full'];
  if (!sDrag.moved) setSheet(state.sheet === 'peek' ? 'half' : 'peek');
  else if (Math.abs(sDrag.v) > 0.4) setSheet(sDrag.v > 0 ? (order.find(k => S[k] > h + 8) || 'full') : ([...order].reverse().find(k => S[k] < h - 8) || 'peek'));   /* flick */
  else setSheet(Object.entries(S).sort((a, b) => Math.abs(a[1] - h) - Math.abs(b[1] - h))[0][0]);
  sDrag = null; };
handle.addEventListener('pointerup', endSheetDrag); handle.addEventListener('pointercancel', endSheetDrag);
handle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setSheet(state.sheet === 'peek' ? 'half' : state.sheet === 'half' ? 'full' : 'peek'); } });
addEventListener('resize', () => setSheet(state.sheet));

/* ============================================================
   Toast + chat (sample replies only)
   ============================================================ */
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function playIn(el, cls){ if (!el || reduceMotion()) return; el.classList.remove('anim-in', 'anim-push', 'anim-pop'); void el.offsetWidth; el.classList.add(cls);
  clearTimeout(el._animT); el._animT = setTimeout(() => el.classList.remove(cls), 800); }
function closeAnimated(el, done){ if (reduceMotion()){ el.hidden = true; return done && done(); }
  el.classList.add('closing'); setTimeout(() => { el.hidden = true; el.classList.remove('closing'); if (done) done(); }, 170); }
function moveIndicators(){ const i = ['explore','routes','planner'].indexOf(state.tab); $('.seg').style.setProperty('--i', i); $('#tabbar').style.setProperty('--i', i); }
function fadeLayer(id, on){ const F = {'shade-sample':['line-opacity', shadeOp()], 'area-fill':['fill-opacity', 1], 'area-line':['line-opacity', 0.75], 'area-label':['text-opacity', 1]}[id];
  if (!mapReady || !map.getLayer(id) || !F) return; map.setLayoutProperty(id, 'visibility', 'visible'); map.setPaintProperty(id, F[0], on ? F[1] : 0); }
let seg2Prev = 0;
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3800); }
const chat = $('#chat'), msgs = $('#msgs'), input = $('#msgIn'), send = $('#sendBtn');
function openChat(){ chat.hidden = false; setTimeout(() => input.focus(), 50); }
function closeChat(){ if (!chat.hidden && !chat.classList.contains('closing')) closeAnimated(chat); }
$('#closeChat').onclick = closeChat;
input.addEventListener('input', () => { send.disabled = !input.value.trim(); });
const REPLIES = [
  [/shadiest|cool|best time|when/i, () => { const o = origin(), d = nowT(), at = x => Math.round(areaShadePct(sunPos(x, o.lat, o.lng).alt) ?? 0);
    const noon = new Date(d); noon.setHours(12, 0, 0, 0); const late = new Date(sunTimes(d, o.lat, o.lng).set.getTime() - 3600e3);
    return `Shade is lowest around midday (about ${at(noon)}% of street length at noon) and grows as the sun drops: about ${at(late)}% an hour before sunset, at ${fmtTime(late)}. (Sample numbers.)`; }],
  [/park|garden|green/i, () => { const p = nearby.filter(x => x.cat === 'park').slice(0, 3); return p.length ? `Closest parks on the map: ${p.map(x => `${x.name} (${fmtDist(x.d)})`).join(', ')}.` : 'I can’t see any named parks on this part of the map. Try zooming out.'; }],
  [/why|cooler|shad/i, () => { if (isNight()) return 'The sun is down right now, so every route is equally shaded.';
    const s = sunNow(), t = state.trip, c = t && t.routes && t.routes.find(r => r.cool), f = t && t.routes && t.routes.find(r => r.fast);
    const base = `The sun is ${Math.round(s.alt)}° high in the ${compass(s.az)}. Streets that run across the sun's direction get the most shade from buildings`;
    return c && f && c !== f ? `${base}, and the cooler route uses more of them: ${c.shade}% vs ${f.shade}% on the fastest route.` : base + '.'; }],
];
function scrollMsgs(){ msgs.scrollTo({top: msgs.scrollHeight, behavior: motionOK() ? 'smooth' : 'auto'}); }
function bubble(text, cls){ const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; msgs.appendChild(d); scrollMsgs(); }
const chatHistory = [];
async function askLive(text, t){
  try {
    const o = origin(), ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 55000);
    const r = await fetch(`${API}/api/region/chat`, {method:'POST', headers:{'Content-Type':'application/json'}, signal:ctl.signal,
      body: JSON.stringify({message:text, history:chatHistory.slice(-8), lat:o.lat, lon:o.lng, when: state.when ? whenISO(nowT()) : null})});
    clearTimeout(tm);
    const j = await r.json(); t.remove();
    const answer = j.answer || j.detail || 'Sorry, something went wrong.';
    bubble(answer, 'in');
    chatHistory.push({role:'user', text}, {role:'assistant', text:answer});
    for (const a of (j.actions || [])) chatAction(a);
  } catch (e){ t.remove(); bubble('I couldn’t reach the assistant. Check your connection and try again.', 'in'); }
}
function chatAction(a){
  if (a.type === 'route'){
    const me = state.me && dist(state.me, a.from) < 60 ? meAsPoint() : {name:a.from.name, lng:a.from.lng, lat:a.from.lat};
    if (a.when) setWhen(new Date(a.when));
    state.trip = {from:me, to:{name:a.to.name, lng:a.to.lng, lat:a.to.lat}, routes:[], sel:0};
    setView('routes', {sheet: isPhone() ? 'half' : null}); computeTrip();
  } else if (a.type === 'planner' && mapReady){
    map.flyTo({center:[a.lng, a.lat], zoom:15, padding:camPad(), duration:1200});
    setView('planner');
  }
}
function ask(text){
  bubble(text, 'out'); input.value = ''; send.disabled = true;
  if (REGION){ const t = document.createElement('div'); t.className = 'msg in typing'; t.innerHTML = '<i></i><i></i><i></i>'; msgs.appendChild(t); scrollMsgs(); return askLive(text, t); }
  const t = document.createElement('div'); t.className = 'msg in typing'; t.innerHTML = '<i></i><i></i><i></i>'; msgs.appendChild(t); scrollMsgs();
  setTimeout(() => { t.remove(); const m = REPLIES.find(([re]) => re.test(text)); bubble(m ? m[1]() : 'In the live app I’ll answer from your shade data. This preview only has a few sample replies.', 'in'); }, 650);
}
$('#composer').addEventListener('submit', e => { e.preventDefault(); if (input.value.trim()) ask(input.value.trim()); });
$$('.qchips button').forEach(b => b.onclick = () => ask(b.textContent));

/* ============================================================
   Start
   ============================================================ */
setTheme(state.theme);
renderChips(); setSheet('peek');
moveIndicators(); renderWhen(); renderExplore();
initRegion().finally(startMap);
/* live clock: every minute, shade colours, sun marker, routes and the When bar follow the real time */
let liveNight = null;
setInterval(() => {
  if (!state.when){
    const o = origin(), n = sunPos(new Date(), o.lat, o.lng).alt < -0.833;
    if (liveNight !== null && n !== liveNight) toast(n ? 'The sun has set, so the map is back to normal.' : 'The sun is up. Shade colours are back.');
    liveNight = n; timeChanged(false); maybeWeather();
  }
  if (state.walk) walkTick();
}, 60000);
window.ShadeRoutes = { get map(){ return map; }, state, setWhen, sunPos, sunTimes,
  setAreas(a){ AREAS = a; if (mapReady){ map.getSource('areas').setData(areasFC()); map.getSource('area-pts').setData(areaPtsFC()); shadeSegs.clear(); segGrid.clear(); map.getSource('shade').setData(EMPTY); harvestShade(); } renderExplore(); } };
})();
